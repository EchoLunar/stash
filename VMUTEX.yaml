# 本文件面向 Mihomo；GEOSITE / GEOIP 分类按 MetaCubeX 完整 geo 数据编写。
mode: rule

proxy-groups:
  # Oracle 仅提供 DIRECT / PROXY；其余业务组可跟随 PROXY 或单独选择节点。
  # Crypto 额外提供 DIRECT；REJECT 保证未加载订阅节点时代理组仍有明确的拒绝出口。
  - name: PROXY
    type: select
    include-all: true
  - name: Oracle
    type: select
    proxies:
      - DIRECT
      - PROXY
  - name: AI
    type: select
    proxies:
      - PROXY
    include-all: true
  - name: Crypto
    type: select
    proxies:
      - DIRECT
      - PROXY
    include-all: true
rules:
  # Oracle 分类优先于下方分类；在远程列表中维护 IP 和域名，出口由分组选择。
  - RULE-SET,oracle,Oracle
  # 加密货币合集包含交易所、钱包及行情服务，优先于通用地区与兜底规则。
  - RULE-SET,Crypto,Crypto
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,youtube,PROXY
  - GEOSITE,netflix,PROXY
  - RULE-SET,NetflixIP,PROXY,no-resolve
  - GEOSITE,telegram,PROXY
  - RULE-SET,TelegramIP,PROXY,no-resolve
  - GEOSITE,disney,PROXY
  - GEOSITE,hbo,PROXY
  - GEOSITE,spotify,PROXY
  - GEOSITE,tiktok,PROXY
  - GEOSITE,twitch,PROXY
  - GEOSITE,primevideo,PROXY
  - GEOSITE,bahamut,PROXY
  - RULE-SET,BiliIntl,PROXY
  - GEOSITE,dazn,PROXY
  - GEOSITE,hulu,PROXY
  - GEOSITE,abema,PROXY
  - GEOSITE,bbc,PROXY
  - GEOSITE,dmm,PROXY
  - GEOSITE,niconico,PROXY
  - GEOSITE,viu,PROXY
  - GEOSITE,soundcloud,PROXY
  - GEOSITE,discoveryplus,PROXY
  - GEOSITE,epicgames,PROXY
  - GEOSITE,origin,PROXY
  - GEOSITE,sony,PROXY
  - GEOSITE,nintendo,PROXY
  - GEOSITE,steam,PROXY
  - GEOSITE,github,PROXY
  - GEOSITE,apple,DIRECT
  - GEOSITE,microsoft,DIRECT
  - GEOSITE,bilibili,DIRECT
  - GEOSITE,googlefcm,PROXY
  - GEOSITE,geolocation-!cn,PROXY
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,PROXY
rule-providers:
  oracle:
    type: http
    # 原始 .list 为逐行规则，包含域名和 IP，使用 classical + text。
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/EchoLunar/stash/refs/heads/main/Rules/oracle.list
    path: ./ruleset/oracle.list
    # 每 24 小时检查更新。
    interval: 86400
  Crypto:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-cryptocurrency.list
    path: ./ruleset/Crypto.list
    interval: 86400
  BiliIntl:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/biliintl.list
    path: ./ruleset/BiliIntl.list
    interval: 86400
  NetflixIP:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/classical/netflix.list
    path: ./ruleset/NetflixIP.list
    interval: 86400
  TelegramIP:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/classical/telegram.list
    path: ./ruleset/TelegramIP.list
    interval: 86400
dns:
  # 与 Stash 覆写一致：连接规则按域名匹配，普通域名先返回 Fake IP。
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - 'geosite:private' # 局域网及本地名称使用真实 IP。
    - 'captive.apple.com' # Apple 网络连通性检测使用真实 IP。
    - '+.msftconnecttest.com' # Windows 网络连通性检测使用真实 IP。
    - '+.msftncsi.com' # Windows NCSI 检测使用真实 IP。
  # 对应 Stash 的 follow-rule: false；DNS 上游不按目标业务组转发。
  respect-rules: false
  # DoH 域名启动解析仍使用当前网络的系统 DNS。
  default-nameserver:
    - system
  # 节点服务器域名独立解析，避免连接代理时形成 DNS 循环。
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 需要真实 IP 的公网域名只使用一处国内 DoH，减少不同解析器选点变化。
  nameserver:
    - https://dns.alidns.com/dns-query
  # 私有名称只交给当前网络的系统 DNS，不送到公共 DoH。
  nameserver-policy:
    'geosite:private':
      - system
